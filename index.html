<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#f4ead8"
    >

    <title>Happy Teachers' Day</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <main id="experience">

        <!-- =====================================================
             MAIN BACKGROUND
             ===================================================== -->

        <div
            id="scene-bg"
            class="scene-bg"
            aria-hidden="true"
        ></div>


        <!-- =====================================================
             SCENE 1 — OPENING TITLE
             ===================================================== -->

        <section
            id="intro-title"
            class="scene-layer title-layer"
            aria-hidden="true"
        >

            <div
                id="title-text"
                class="title-text"
            >
                Happy Teachers' Day
            </div>

        </section>


        <!-- =====================================================
             SCENE 2 — INTRODUCTORY MESSAGE
             ===================================================== -->

        <section
            id="intro-message"
            class="scene-layer intro-layer"
            aria-hidden="true"
        >

            <div
                id="intro-line"
                class="intro-line"
            ></div>

        </section>


        <!-- =====================================================
             SCENE 3 — FLOWER SELECTION
             ===================================================== -->

        <section
            id="flower-scene"
            class="scene-layer flower-layer"
            aria-hidden="true"
        >

            <div
                id="flower-grid"
                class="flower-grid"
            >

                <button
                    type="button"
                    class="flower-hit"
                    data-flower="1"
                    aria-label="Choose flower 1"
                ></button>

                <button
                    type="button"
                    class="flower-hit"
                    data-flower="2"
                    aria-label="Choose flower 2"
                ></button>

                <button
                    type="button"
                    class="flower-hit"
                    data-flower="3"
                    aria-label="Choose flower 3"
                ></button>

                <button
                    type="button"
                    class="flower-hit"
                    data-flower="4"
                    aria-label="Choose flower 4"
                ></button>

                <button
                    type="button"
                    class="flower-hit"
                    data-flower="5"
                    aria-label="Choose flower 5"
                ></button>

                <button
                    type="button"
                    class="flower-hit"
                    data-flower="6"
                    aria-label="Choose flower 6"
                ></button>

                <button
                    type="button"
                    class="flower-hit"
                    data-flower="7"
                    aria-label="Choose flower 7"
                ></button>

                <button
                    type="button"
                    class="flower-hit"
                    data-flower="8"
                    aria-label="Choose flower 8"
                ></button>

                <button
                    type="button"
                    class="flower-hit"
                    data-flower="9"
                    aria-label="Choose flower 9"
                ></button>

                <button
                    type="button"
                    class="flower-hit"
                    data-flower="10"
                    aria-label="Choose flower 10"
                ></button>

            </div>

        </section>


        <!-- =====================================================
             PARTICLE EFFECT
             ===================================================== -->

        <canvas
            id="particle-canvas"
            aria-hidden="true"
        ></canvas>


        <!-- =====================================================
             SCENE 4 — LETTER / ENVELOPE
             ===================================================== -->

        <section
            id="letter-scene"
            class="scene-layer letter-layer"
            aria-hidden="true"
        >

            <div
                id="letter-message-box"
                class="letter-message-box"
            >

                <div
                    id="letter-message"
                    class="letter-message"
                ></div>

            </div>


            <!-- FINISH BUTTON -->

            <button
                id="finish-button"
                class="finish-button"
                type="button"
                aria-label="Finish"
            >

                <img
                    src="assets/finish-button.png"
                    alt="Finish"
                    draggable="false"
                >

            </button>

        </section>


        <!-- =====================================================
             SCENE 5 — FINAL REVEAL
             ===================================================== -->

        <section
            id="final-scene"
            class="scene-layer final-layer"
            aria-hidden="true"
        >

            <img
                id="final-logo"
                class="final-logo"
                src="assets/logo-3.png"
                alt="Institute of English Studies"
                draggable="false"
            >

        </section>


        <!-- =====================================================
             PORTRAIT WARNING
             ===================================================== -->

        <div
            id="portrait-warning"
            class="portrait-warning"
            aria-hidden="true"
        >

            <div class="portrait-warning-text">
                Please turn your phone sideways to continue.
            </div>

        </div>

    </main>


    <!-- =========================================================
         JAVASCRIPT
         ========================================================= -->

    <script src="script.js"></script>

</body>
</html>
